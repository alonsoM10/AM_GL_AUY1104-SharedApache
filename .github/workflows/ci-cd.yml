name: CI/CD Apache Server

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build y Push a Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: 1 · Descargar código
        uses: actions/checkout@v4

      - name: 2 · Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3 · Build y Push imagen
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/apache-server"
          TAG="${{ github.ref_name }}"
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push --all-tags "${IMAGE}"

  deploy-to-k8s:
    name: Deploy a k3s en AWS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 1 · Descargar código (manifiestos k8s)
        uses: actions/checkout@v4

      - name: 2 · Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: 3 · Copiar manifiestos y aplicar en k3s
        run: |
          set -euo pipefail
          IP="${{ vars.K3S_SERVER_PUBLIC_IP }}"
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${IP}" 'sudo rm -rf /tmp/k8s-apache'
          scp -o StrictHostKeyChecking=accept-new -r k8s "ubuntu@${IP}:/tmp/k8s-apache"
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${IP}" \
            'sudo k3s kubectl apply -f /tmp/k8s-apache/'

      - name: 4 · Verificar pods
        run: |
          IP="${{ vars.K3S_SERVER_PUBLIC_IP }}"
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${IP}" \
            'sudo k3s kubectl get pods -o wide'
